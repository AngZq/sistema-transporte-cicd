name: CD Pipeline - Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Desplegar en Produccion
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Copiar archivos al servidor AWS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        source: "."
        target: "/home/ubuntu/sistema-transporte-produccion"

    - name: Iniciar contenedores en AWS (Docker)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/sistema-transporte-produccion
          sudo docker compose down
          sudo docker compose up -d --build