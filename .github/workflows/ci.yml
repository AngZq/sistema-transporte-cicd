name: CI Pipeline - Exportronic Transporte

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v3

    - name: Configurar entorno Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependencias del Backend
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Revisar calidad del código (Linter)
      run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar Pruebas Unitarias (Testing)
      run: pytest backend/